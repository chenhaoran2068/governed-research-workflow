# v0.11.0 manuscript-governance and public-experience source retains the
# v0.4-v0.10.2 bounded control scopes. It adds generic blank templates and a
# redacted experience collection, but no data access, public intake, network
# action, agent runtime, delegation, generic writer, recovery executor, or
# release decision. This manifest never proves that a selected version is
# installed or released:
# verify an exact annotated tag and matching GitHub Release at installation
# time. The workspace framework-contract version remains 0.1.0.
manifest_schema_version: 1
system_id: governed-research-workflow
system_version: 0.11.0
system_role: governed-research-and-manuscript-orchestration
entry_point: SKILL.md
supported_profiles:
  - standalone
  - framework_integrated
required_dependencies:
  - jsonschema==4.26.0
optional_shared_services: []
framework_compatibility:
  # This schema field denotes the framework contract version, not the exact
  # framework release used for this source revision's validation.
  supported_framework_versions: "0.1.0"
project_ownership_behavior: primary_system
data_access_boundary: no-data-access-is-granted-by-this-system-manifest
