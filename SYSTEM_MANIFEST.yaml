# v1.13.0 derives from immutable v1.12.0 and clarifies the existing
# GRW-CAP-180-01 lifecycle decision order without adding a capability, schema,
# validator, dependency, Framework contract, Skill bridge, or execution route.
# It retains the frozen v1.0.0 public contract and previously admitted scopes,
# including GRW-CAP-220-01's metadata-only managed reading knowledge-service
# consumer boundary. It adds no
# research execution, data access, public intake, network action, agent
# runtime, delegation, generic writer, recovery executor, submission, approval,
# or release decision.
# This manifest never proves that a selected version is
# installed or released:
# verify an exact annotated tag and matching GitHub Release at installation
# time. The workspace framework-contract version for this source is exactly
# 0.4.0 and is not a compatibility range.
manifest_schema_version: 1
system_id: governed-research-workflow
system_version: 1.13.0
system_role: governed-research-and-manuscript-orchestration
entry_point: SKILL.md
supported_profiles:
  - standalone
  - framework_integrated
required_dependencies:
  - jsonschema==4.26.0
optional_shared_services:
  - scholarly-reading-knowledge
framework_compatibility:
  # This source revision declares only the exact Framework v0.4.0 contract.
  # Candidate and released identities remain separately verified.
  supported_framework_versions: "0.4.0"
project_ownership_behavior: primary_system
data_access_boundary: no-data-access-is-granted-by-this-system-manifest
