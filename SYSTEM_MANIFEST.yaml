# v1.9.2 retains the frozen v1.0.0 public contract and previously admitted
# scopes. It maintains GRW-CAP-190-01 by strengthening the System-entry
# metadata for a possible new Study and requiring its human-confirmable route
# recommendation to begin with a literal route code. It adds no research
# execution, data access, public intake, network action, agent runtime,
# delegation, generic writer, recovery executor, or release decision.
# This manifest never proves that a selected version is
# installed or released:
# verify an exact annotated tag and matching GitHub Release at installation
# time. The workspace framework-contract version for this source is exactly
# 0.2.0 and is not a compatibility range.
manifest_schema_version: 1
system_id: governed-research-workflow
system_version: 1.9.2
system_role: governed-research-and-manuscript-orchestration
entry_point: SKILL.md
supported_profiles:
  - standalone
  - framework_integrated
required_dependencies:
  - jsonschema==4.26.0
optional_shared_services: []
framework_compatibility:
  # This source revision declares only the exact Framework v0.2.0 contract.
  # Candidate and released identities remain separately verified.
  supported_framework_versions: "0.2.0"
project_ownership_behavior: primary_system
data_access_boundary: no-data-access-is-granted-by-this-system-manifest
