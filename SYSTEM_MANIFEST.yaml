# v1.18.1 is a maintenance patch derived from immutable public v1.18.0. It
# clarifies the repository naming contract, records the fuller research
# identity outside the short repository name, and defines controlled promotion
# of an accepted clean candidate into the Framework-owned Github/ worktree.
# It adds no capability, dependency, Framework location, or automatic action.
# v1.18.0 derives from immutable public v1.16.0. It absorbs the accepted but
# unpublished v1.17 Study-status candidate as GRW-CAP-250-01 and adds
# GRW-CAP-260-01: a generic paper-repository standard, blank release records,
# explicit file-only clean-export builder, structural schemas, and a read-only
# candidate validator. It retains the frozen v1.0.0 public contract and all
# previously admitted scopes. It adds no Study discovery, status decision,
# research execution, data access, repository creation, Git/GitHub action,
# publication, submission, approval, or release decision.
# This manifest never proves that a selected version is
# installed or released:
# verify an exact annotated tag and matching GitHub Release at installation
# time. The workspace framework-contract version for this source is exactly
# 0.4.0 and is not a compatibility range.
manifest_schema_version: 1
system_id: governed-research-workflow
system_version: 1.18.1
system_role: governed-research-and-manuscript-orchestration
entry_point: SKILL.md
supported_profiles:
  - standalone
  - framework_integrated
required_dependencies:
  - jsonschema==4.26.0
optional_shared_services:
  - scholarly-reading-knowledge
framework_compatibility:
  # This source revision declares only the exact Framework v0.4.0 contract.
  # Candidate and released identities remain separately verified.
  supported_framework_versions: "0.4.0"
project_ownership_behavior: primary_system
data_access_boundary: no-data-access-is-granted-by-this-system-manifest
