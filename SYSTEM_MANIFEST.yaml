# v1.7.0 retains the frozen v1.0.0 public contract, GRW-CAP-150-01, and the
# historical GRW-CAP-160-01 card library. It adds GRW-CAP-170-01 generic
# collaboration guidance and three public-safe cards. It adds no research
# execution, data access, public intake, network action, agent runtime,
# delegation, generic writer, recovery executor, or release decision. This
# manifest never proves that a selected version is
# installed or released:
# verify an exact annotated tag and matching GitHub Release at installation
# time. The workspace framework-contract version for this source is exactly
# 0.2.0 and is not a compatibility range.
manifest_schema_version: 1
