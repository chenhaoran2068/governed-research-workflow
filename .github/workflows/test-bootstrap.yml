name: Test governed research workflow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check out the exact released framework commit for integration validation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: chenhaoran2068/governed-research-workspace-framework
          ref: 69c76f84a5b0913b26c17ea48f152dbc50b4bec6
          path: _framework_release
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install workflow and framework validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r _framework_release/requirements-dev.txt
      - name: Run standalone and cross-repository integration tests
        env:
          FRAMEWORK_REPOSITORY_ROOT: ${{ github.workspace }}/_framework_release
          FRAMEWORK_RELEASE_TAG: v0.2.0
          FRAMEWORK_EXPECTED_COMMIT: 69c76f84a5b0913b26c17ea48f152dbc50b4bec6
        run: python -m unittest discover -s tests -v
